name: Release

# Push a x.y.z tag to publish every RIoT2.Core package with that version to GitHub Packages: the
# packages under src/ (including the RIoT2.Core.Devices.Build MSBuild package), the RIoT2.Core
# facade, RIoT2.Core.Devices.Testing and RIoT2.Core.Hosting (plan M1 step 2). Project references
# become dependencies on the same version. Then bump the consumers (release order:
# docs/increments/README.md in the .github repository).

on:
  push:
    tags: ["*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  validate:
    uses: Revolutionized-IoT2/.github/.github/workflows/dotnet-validate.yml@main
    with:
      build: RIoT2.Core.sln
      github-packages: false

  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        project:
          - src/Contracts/RIoT2.Core.Contracts.csproj
          - src/Mqtt/RIoT2.Core.Mqtt.csproj
          - src/Http/RIoT2.Core.Http.csproj
          - src/Devices/RIoT2.Core.Devices.csproj
          - src/Devices.Build/RIoT2.Core.Devices.Build.csproj
          - src/Node/RIoT2.Core.Node.csproj
          - RIoT2.Core.csproj
          - Testing/RIoT2.Core.Devices.Testing.csproj
          - Hosting/RIoT2.Core.Hosting.csproj
    uses: Revolutionized-IoT2/.github/.github/workflows/nuget-publish.yml@main
    with:
      project: ${{ matrix.project }}
      push: true
    secrets: inherit
