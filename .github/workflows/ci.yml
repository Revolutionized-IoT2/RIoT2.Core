name: CI

# Core's tests live in RIoT2.Tests, whose nightly run builds Core from main.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    uses: Revolutionized-IoT2/.github/.github/workflows/dotnet-validate.yml@main
    with:
      build: RIoT2.Core.sln
      github-packages: false
      # tools/SchemaExport rewrites contracts/schemas on every build; it must be committed as built.
      verify-generated: true

  # Packaging smoke test for every package the release publishes.
  pack:
    strategy:
      fail-fast: false
      matrix:
        project:
          - src/Contracts/RIoT2.Core.Contracts.csproj
          - src/Mqtt/RIoT2.Core.Mqtt.csproj
          - src/Http/RIoT2.Core.Http.csproj
          - src/Devices/RIoT2.Core.Devices.csproj
          - src/Node/RIoT2.Core.Node.csproj
          - RIoT2.Core.csproj
          - Testing/RIoT2.Core.Devices.Testing.csproj
          - Hosting/RIoT2.Core.Hosting.csproj
    uses: Revolutionized-IoT2/.github/.github/workflows/nuget-publish.yml@main
    with:
      project: ${{ matrix.project }}

  secret-scan:
    uses: Revolutionized-IoT2/.github/.github/workflows/secret-scan.yml@main
